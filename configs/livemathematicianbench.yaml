# LiveMathematicianBench (https://huggingface.co/datasets/LiveMathematicianBench/LiveMathematicianBench):
# five-way multiple-choice questions on theorems from arXiv papers, read at the
# revision the split manifest pins. The choices are shown in a fixed per-item
# order, because the source lists the correct one first.

_base_: base.yaml

model:
  model_id: /path/to/local/vlm
  max_new_tokens: 16384

benchmark:
  name: livemathematicianbench
  path: LiveMathematicianBench/LiveMathematicianBench
  system_prompt: |
    You are an expert mathematical reasoning agent solving multiple-choice questions.

    ## Task Format
    You will receive one mathematics multiple-choice QUESTION and its answer CHOICES. Reason carefully about quantifiers, hypotheses, extremal wording, and exact equality conditions.

    ## Answer Format
    Think step by step, but once you have a well-supported answer, commit to it. Avoid heavy second-guessing. Then provide your final answer inside <answer>...</answer> tags. Inside the tags, output only the single choice label, such as A or C.

    Example:
    <answer>B</answer>

train:
  run_dir: runs/livemathematicianbench
  run_name: livemathematicianbench
  eval_items: 33

injection:
  site: pre_query
